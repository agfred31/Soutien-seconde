<style>
:root{
  --bg:#f4f5fb;--card:#fff;--ink:#1b1d2a;--mute:#6b6f85;--line:#e6e8f2;
  --accent:#4f46e5;--accent-ink:#fff;--ok:#16a34a;--ok-bg:#dcfce7;--ko:#dc2626;--ko-bg:#fee2e2;--gold:#d97706;
  --shadow:0 1px 2px rgba(20,22,40,.06),0 6px 18px rgba(20,22,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10121c;--card:#1a1d2b;--ink:#eef0fa;--mute:#9aa0bc;--line:#2a2e42;
    --accent:#818cf8;--accent-ink:#10121c;--ok:#4ade80;--ok-bg:#12351f;--ko:#f87171;--ko-bg:#3b1618;--gold:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.4px}
h2{font-size:18px;margin:22px 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:600;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
.btn.small{padding:9px 14px;width:auto;display:inline-block;font-size:14px}
.btn:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{background:var(--card);border:0;border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);
  color:var(--ink);font:inherit;cursor:pointer;border-top:4px solid var(--c)}
.subj .em{font-size:26px}
.subj .nm{font-weight:600;margin-top:4px;font-size:15px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.small-t{font-size:12px;color:var(--mute);margin-top:4px}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;text-align:left;font:inherit;color:var(--ink);
  box-shadow:var(--shadow);cursor:pointer;width:100%;display:flex;gap:12px;align-items:center}
.item.on{border-color:var(--accent)}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chips{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--mute);margin:0 4px 4px 0}
.tag.lv3{background:#fde68a;color:#92400e}.tag.lv2{background:#dbeafe;color:#1e40af}.tag.lv1{background:#dcfce7;color:#166534}
.qtext{font-size:19px;font-weight:600;margin:12px 0 18px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);
  border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt:disabled{cursor:default}
.expl{background:var(--card);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:15px}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0 0}
.center{text-align:center}
.miss{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);font-size:15px}
.miss b{display:block;margin-bottom:4px}
.good{color:var(--ok);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;max-width:200px;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px;cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs span{display:block;font-size:22px}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.hist:last-child{border:0}
.warn{background:var(--ko-bg);color:var(--ko);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.exam{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--line)}
.pill.soon{background:#fee2e2;color:#991b1b}.pill.mid{background:#fef3c7;color:#92400e}
input[type=text],input[type=date]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.lvl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl-row .stat b{font-size:20px}
.weak{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.weak:last-child{border:0}
</style>
</head>

const QUESTIONS = [{"m":"ma","c":"Nombres et calculs","d":1,"q":"Quelle est la valeur de |−5 + 2| ?","o":["3","7","−3","−7"],"e":"−5 + 2 = −3, et la valeur absolue d'un nombre est sa distance à 0 : |−3| = 3."},{"m":"ma","c":"Nombres et calculs","d":1,"q":"L'écriture x ∈ [−2 ; 3[ signifie :","o":["−2 ≤ x < 3","−2 < x ≤ 3","−2 ≤ x ≤ 3","−2 < x < 3"],"e":"Le crochet tourné vers l'intérieur inclut la borne (−2), le crochet tourné vers l'extérieur exclut la borne (3)."},{"m":"ma","c":"Nombres et calculs","d":1,"q":"Quel est le développement de (x + 3)² ?","o":["x² + 6x + 9","x² + 9","x² + 3x + 9","x² + 6x + 6"],"e":"Identité remarquable : (a + b)² = a² + 2ab + b², donc x² + 2×3×x + 9."},{"m":"ma","c":"Nombres et calculs","d":1,"q":"Quelle est la factorisation de x² − 9 ?","o":["(x − 3)(x + 3)","(x − 3)²","(x + 3)²","(x − 9)(x + 1)"],"e":"a² − b² = (a − b)(a + b), avec a = x et b = 3."},{"m":"ma","c":"Nombres et calculs","d":1,"q":"Quelle est la forme simplifiée de √50 ?","o":["5√2","25√2","10√5","5√5"],"e":"√50 = √(25 × 2) = √25 × √2 = 5√2."},{"m":"ma","c":"Nombres et calculs","d":1,"q":"Une quantité augmente de 20 %, puis diminue de 20 %. Au total, elle a :","o":["Baissé de 4 %","Retrouvé sa valeur initiale","Augmenté de 4 %","Baissé de 40 %"],"e":"Coefficients multiplicateurs : 1,2 × 0,8 = 0,96, soit une baisse de 4 %. Les pourcentages ne s'annulent pas."},{"m":"ma","c":"Calcul littéral et équations","d":1,"q":"Quelle est la solution de 2x + 5 = 11 ?","o":["x = 3","x = 8","x = 3,5","x = 6"],"e":"2x = 11 − 5 = 6, donc x = 3."},{"m":"ma","c":"Inéquations et signes","d":1,"q":"Quel est l'ensemble des solutions de −3x ≥ 6 ?","o":["x ≤ −2","x ≥ −2","x ≤ 2","x ≥ 2"],"e":"On divise par −3 : l'inégalité change de sens, donc x ≤ −2."},{"m":"ma","c":"Fonctions de référence","d":1,"q":"Sur ]−∞ ; 0], la fonction carré x ↦ x² est :","o":["Décroissante","Croissante","Constante","Ni croissante ni décroissante"],"e":"Plus x se rapproche de 0 par la gauche, plus x² diminue : la fonction carré est décroissante sur ]−∞ ; 0] et croissante sur [0 ; +∞[."},{"m":"ma","c":"Fonctions de référence","d":1,"q":"Quel est l'ensemble de définition de f(x) = 1/x ?","o":["ℝ privé de 0","ℝ","]0 ; +∞[","ℝ privé de 1"],"e":"On ne peut pas diviser par 0 : f est définie sur ℝ*."},{"m":"ma","c":"Fonctions : généralités","d":1,"q":"Si f(x) = −2x + 4, que vaut f(3) ?","o":["−2","2","10","−10"],"e":"f(3) = −2 × 3 + 4 = −6 + 4 = −2."},{"m":"ma","c":"Géométrie repérée et droites","d":1,"q":"Quelle est l'équation de la droite de coefficient directeur 2 passant par le point (0 ; 1) ?","o":["y = 2x + 1","y = x + 2","y = 2x − 1","y = −2x + 1"],"e":"Équation réduite y = mx + p avec m = 2 (coefficient directeur) et p = 1 (ordonnée à l'origine)."},{"m":"ma","c":"Vecteurs","d":1,"q":"Pour A(1 ; 2) et B(4 ; 6), quelles sont les coordonnées du vecteur AB ?","o":["(3 ; 4)","(5 ; 8)","(−3 ; −4)","(4 ; 3)"],"e":"AB = (xB − xA ; yB − yA) = (4 − 1 ; 6 − 2) = (3 ; 4)."},{"m":"ma","c":"Géométrie repérée et droites","d":1,"q":"Quelles sont les coordonnées du milieu de [AB] avec A(2 ; −1) et B(6 ; 5) ?","o":["(4 ; 2)","(8 ; 4)","(2 ; 3)","(4 ; 3)"],"e":"Milieu = moyenne des coordonnées : ((2 + 6)/2 ; (−1 + 5)/2) = (4 ; 2)."},{"m":"ma","c":"Vecteurs","d":1,"q":"Les vecteurs u(2 ; 3) et v(4 ; 6) sont-ils colinéaires ?","o":["Oui, car 2×6 − 3×4 = 0","Non, car 2×6 − 3×4 ≠ 0","Non, car ils n'ont pas la même norme","Oui, car ils ont les mêmes coordonnées"],"e":"Deux vecteurs sont colinéaires si xy′ − x′y = 0. Ici v = 2u."},{"m":"ma","c":"Statistiques et probabilités","d":1,"q":"On lance un dé équilibré à 6 faces. Quelle est la probabilité d'obtenir un multiple de 3 ?","o":["1/3","1/6","1/2","2/3"],"e":"Les multiples de 3 sont 3 et 6 : 2 issues favorables sur 6, soit 2/6 = 1/3."},{"m":"ma","c":"Statistiques et probabilités","d":1,"q":"Quelle est la médiane de la série 4 ; 7 ; 9 ; 12 ; 20 ?","o":["9","10,4","12","7"],"e":"La série est déjà ordonnée avec 5 valeurs : la médiane est la 3e, soit 9. (10,4 est la moyenne.)"},{"m":"fr","c":"Théâtre","d":1,"q":"Qui est l'auteur de la comédie Tartuffe ?","o":["Molière","Racine","Corneille","Marivaux"],"e":"Tartuffe ou l'Imposteur est une comédie de Molière (XVIIe siècle), qui dénonce l'hypocrisie religieuse."},{"m":"fr","c":"Théâtre","d":1,"q":"Quelle est la règle des trois unités du théâtre classique ?","o":["Unité de temps, de lieu et d'action","Unité de temps, de personnage et d'action","Unité de lieu, d'intrigue et de style","Unité d'action, de ton et de durée"],"e":"La pièce classique se déroule en 24 heures, dans un seul lieu, autour d'une seule intrigue principale."},{"m":"fr","c":"Théâtre","d":1,"q":"Phèdre, de Racine, est :","o":["Une tragédie classique du XVIIe siècle","Une comédie de mœurs","Un drame romantique","Une farce médiévale"],"e":"Racine est le grand auteur de tragédies du classicisme ; Phèdre date de 1677."},{"m":"fr","c":"Poésie et versification","d":1,"q":"Un alexandrin est un vers de :","o":["12 syllabes","10 syllabes","8 syllabes","14 syllabes"],"e":"L'alexandrin compte 12 syllabes, avec en général une césure après la 6e."},{"m":"fr","c":"Poésie et versification","d":1,"q":"Quel schéma correspond à des rimes embrassées ?","o":["ABBA","AABB","ABAB","ABCD"],"e":"Rimes plates : AABB ; croisées : ABAB ; embrassées : ABBA."},{"m":"fr","c":"Poésie et versification","d":1,"q":"Qui sont les principaux poètes de la Pléiade (XVIe siècle) ?","o":["Ronsard et Du Bellay","Hugo et Lamartine","Baudelaire et Verlaine","Molière et La Fontaine"],"e":"La Pléiade renouvelle la poésie française à la Renaissance : Ronsard, Du Bellay, mais aussi Louise Labé en marge du groupe."},{"m":"fr","c":"Poésie et versification","d":1,"q":"Qui a écrit le recueil Les Fleurs du mal (1857) ?","o":["Baudelaire","Rimbaud","Apollinaire","Hugo"],"e":"Charles Baudelaire, dont le recueil fut condamné pour atteinte à la morale publique."},{"m":"fr","c":"Figures de style","d":1,"q":"« Il est fort comme un lion. » Quelle est la figure de style ?","o":["Une comparaison","Une métaphore","Une hyperbole","Une antithèse"],"e":"Il y a un outil de comparaison (« comme ») : c'est une comparaison."},{"m":"fr","c":"Figures de style","d":1,"q":"Qu'est-ce qu'une métaphore ?","o":["Une comparaison sans outil de comparaison","Une exagération","L'opposition de deux termes","Une répétition de sons"],"e":"Exemple : « Cet homme est un lion ». L'exagération est l'hyperbole, l'opposition l'antithèse."},{"m":"fr","c":"Roman et récit","d":1,"q":"Dans un récit à focalisation interne :","o":["Le récit suit la perception d'un personnage","Le narrateur en sait plus que les personnages","Le narrateur décrit seulement l'extérieur","Le narrateur s'adresse au lecteur"],"e":"Focalisation interne = point de vue d'un personnage ; zéro = narrateur omniscient ; externe = vision extérieure."},{"m":"fr","c":"Histoire littéraire","d":1,"q":"Zola est le chef de file de quel mouvement littéraire ?","o":["Le naturalisme","Le romantisme","Le surréalisme","Le classicisme"],"e":"Zola, avec Les Rougon-Macquart, étudie l'influence de l'hérédité et du milieu sur les individus."},{"m":"fr","c":"Grammaire et langue","d":1,"q":"Au passé, le passé simple sert surtout à :","o":["Raconter les actions principales","Décrire et exprimer des habitudes","Énoncer des vérités générales","Exprimer le futur"],"e":"Le passé simple porte l'action du premier plan ; l'imparfait installe le décor et les habitudes."},{"m":"fr","c":"Littérature d'idées","d":1,"q":"Voltaire, dans Candide, utilise le genre :","o":["Du conte philosophique","De la tragédie","Du roman naturaliste","De l'épopée"],"e":"Voltaire critique l'optimisme et les injustices à travers un récit ironique : c'est un conte philosophique des Lumières."},{"m":"fr","c":"Littérature d'idées","d":1,"q":"Qui est l'auteur de Gargantua, œuvre humaniste du XVIe siècle ?","o":["Rabelais","Montesquieu","La Fontaine","Diderot"],"e":"François Rabelais, figure de l'humanisme de la Renaissance."},{"m":"fr","c":"Littérature d'idées","d":1,"q":"Dans Les Lettres persanes, Montesquieu critique la société française par :","o":["Le regard étonné de voyageurs persans","Un récit d'aventures maritimes","Un discours du roi","Une pièce de théâtre"],"e":"C'est le procédé du regard étranger : l'étonnement des Persans révèle les travers de la société."},{"m":"fr","c":"Argumentation","d":1,"q":"Dans un texte argumentatif, la thèse est :","o":["L'opinion que l'auteur défend","Un exemple illustrant le propos","L'opinion de l'adversaire","Le plan du texte"],"e":"La thèse est soutenue par des arguments, eux-mêmes illustrés par des exemples. L'opinion adverse est la thèse réfutée."},{"m":"de","c":"Cas et déclinaisons","d":1,"q":"Ich sehe ___ Mann. (sehen + COD, Mann est masculin)","o":["den","der","dem","des"],"e":"Le COD se met à l'accusatif : le masculin « der » devient « den »."},{"m":"de","c":"Cas et déclinaisons","d":1,"q":"Ich gebe ___ Mutter ein Geschenk. (ma mère = COI)","o":["meiner","meine","meinen","meinem"],"e":"Mutter est féminin ; le datif féminin est « meiner »."},{"m":"de","c":"Prépositions","d":1,"q":"Quelle préposition est toujours suivie du datif ?","o":["mit","für","durch","ohne"],"e":"Datif : aus, bei, mit, nach, seit, von, zu. « für, durch, ohne » sont suivies de l'accusatif."},{"m":"de","c":"Prépositions","d":1,"q":"Ich bin in ___ Schule. (question : Wo ?)","o":["der","die","den","das"],"e":"Avec une préposition mixte, « Wo ? » (lieu fixe) → datif ; « Wohin ? » (direction) → accusatif. Schule est féminin, datif : « der »."},{"m":"de","c":"Prépositions","d":1,"q":"Ich gehe in ___ Schule. (question : Wohin ?)","o":["die","der","dem","das"],"e":"« Wohin ? » (direction) → accusatif. Schule est féminin : « die »."},{"m":"de","c":"Syntaxe et subordonnées","d":1,"q":"Quelle phrase respecte l'ordre des mots (principale) ?","o":["Heute gehe ich ins Kino.","Heute ich gehe ins Kino.","Ich heute gehe ins Kino.","Heute ich ins Kino gehe."],"e":"Le verbe conjugué occupe toujours la 2e position dans une principale."},{"m":"de","c":"Syntaxe et subordonnées","d":1,"q":"Quelle phrase est correcte avec « weil » (parce que) ?","o":["Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil ich bin krank.","Ich bleibe zu Hause, weil bin ich krank.","Ich bleibe zu Hause weil krank ich bin."],"e":"Après « weil », le verbe conjugué part en fin de proposition."},{"m":"de","c":"Conjugaison","d":1,"q":"« Je me lève à 7 heures » se dit :","o":["Ich stehe um 7 Uhr auf.","Ich aufstehe um 7 Uhr.","Ich auf stehe um 7 Uhr.","Ich stehe um 7 Uhr auf stehen."],"e":"Dans un verbe séparable (aufstehen), le préfixe va en fin de phrase."},{"m":"de","c":"Syntaxe et subordonnées","d":1,"q":"Ich habe ___ Auto.","o":["kein","nicht","keine","nichts"],"e":"« kein » nie un nom (sans article ou précédé de « ein »). Auto est neutre : « kein Auto ». « nicht » nie un verbe ou un adjectif."},{"m":"de","c":"Conjugaison","d":1,"q":"Quel est le participe passé correct de « essen » ?","o":["Ich habe gegessen","Ich bin gegessen","Ich habe geessen","Ich habe gegesst"],"e":"Essen est un verbe fort : participe passé gegessen, avec l'auxiliaire haben."},{"m":"de","c":"Conjugaison","d":1,"q":"Quel est le parfait correct de « gehen » ?","o":["Ich bin gegangen","Ich habe gegangen","Ich bin gegehen","Ich habe gegeht"],"e":"Les verbes de mouvement se conjuguent avec sein : ich bin gegangen."},{"m":"de","c":"Conjugaison","d":1,"q":"Du ___ nach Berlin. (fahren)","o":["fährst","fahrst","fährt","fahrest"],"e":"Fahren fait partie des verbes à voyelle changeante : a → ä aux 2e et 3e personnes du singulier."},{"m":"de","c":"Conjugaison","d":1,"q":"Gestern ___ ich krank. (sein au prétérit)","o":["war","bin","wurde","wäre"],"e":"Prétérit de sein : ich war, du warst, er war…"},{"m":"de","c":"Conjugaison","d":1,"q":"Ich ___ schwimmen. (je sais nager)","o":["kann","kannst","können","könnt"],"e":"Verbe modal können : ich kann, du kannst, er kann."},{"m":"de","c":"Vocabulaire","d":1,"q":"Quel est le pluriel de « das Kind » ?","o":["die Kinder","die Kinds","die Kinden","das Kinder"],"e":"Au pluriel, l'article est toujours « die » : die Kinder."},{"m":"de","c":"Adjectifs et pronoms","d":1,"q":"Quel est le comparatif de « gut » ?","o":["besser","guter","mehr gut","bestes"],"e":"Comparatif irrégulier : gut → besser → am besten."},{"m":"de","c":"Vocabulaire","d":1,"q":"Quel est le genre de « Mädchen » (la fille) ?","o":["Neutre : das Mädchen","Féminin : die Mädchen","Masculin : der Mädchen","Pas de genre"],"e":"Les noms en -chen sont toujours neutres, même pour des êtres féminins."},{"m":"de","c":"Vocabulaire","d":1,"q":"Que signifie « siebzehn » ?","o":["17","70","7","27"],"e":"sieben = 7, zehn = 10 ; siebzig = 70 ; siebenundzwanzig = 27."},{"m":"de","c":"Vocabulaire","d":1,"q":"Que signifie « der Bahnhof » ?","o":["La gare","L'hôpital","Le marché","La mairie"],"e":"Bahn = voie ferrée, Hof = cour : la gare."},{"m":"en","c":"Temps verbaux","d":1,"q":"I ___ in Paris since 2020.","o":["have lived","lived","live","am living"],"e":"« since » + point de départ dans le passé avec un lien avec le présent → present perfect."},{"m":"en","c":"Temps verbaux","d":1,"q":"She ___ yesterday.","o":["arrived","has arrived","had arrived","has been arriving"],"e":"Avec un repère de temps terminé (yesterday), on emploie le prétérit."},{"m":"en","c":"Hypothèse et subordination","d":1,"q":"If I ___ rich, I would travel the world.","o":["were","am","will be","would be"],"e":"Condition irréelle au présent : if + prétérit, would + base verbale (« were » à toutes les personnes)."},{"m":"en","c":"Temps verbaux","d":1,"q":"Quelle est la forme de « go » au prétérit ?","o":["went","goed","gone","going"],"e":"go – went – gone. « gone » est le participe passé."},{"m":"en","c":"Temps verbaux","d":1,"q":"Quel est le participe passé de « write » ?","o":["written","wrote","writed","writen"],"e":"write – wrote – written."},{"m":"en","c":"Modaux","d":1,"q":"Quelle phrase exprime une interdiction ?","o":["You mustn't park here.","You don't have to park here.","You needn't park here.","You may park here."],"e":"« mustn't » = interdiction ; « don't have to » = absence d'obligation."},{"m":"en","c":"Temps verbaux","d":1,"q":"« We used to play football every Sunday » exprime :","o":["Une habitude passée révolue","Une habitude actuelle","Une action future","Une obligation"],"e":"« used to » + base verbale : habitude ou état passé qui n'existe plus."},{"m":"en","c":"Passif et discours indirect","d":1,"q":"The book ___ by George Orwell in 1949.","o":["was written","wrote","is writing","has write"],"e":"Passif : be + participe passé. Ici, prétérit passif → was written."},{"m":"en","c":"Passif et discours indirect","d":1,"q":"« I am tired », he said. Discours indirect :","o":["He said (that) he was tired.","He said he is tired.","He says he was tired.","He said I am tired."],"e":"Au discours indirect passé, on recule les temps : am → was."},{"m":"en","c":"Grammaire courante","d":1,"q":"I'm looking forward ___ you.","o":["to seeing","to see","for seeing","at see"],"e":"« look forward to » est suivi d'un verbe en -ing (to est une préposition)."},{"m":"en","c":"Grammaire courante","d":1,"q":"How ___ students are there in your class ?","o":["many","much","few","lot"],"e":"« many » avec un dénombrable (students), « much » avec un indénombrable."},{"m":"en","c":"Grammaire courante","d":1,"q":"Quel est le comparatif de « good » ?","o":["better","gooder","more good","best"],"e":"good – better – the best."},{"m":"en","c":"Lexique et faux amis","d":1,"q":"Que signifie le phrasal verb « give up » ?","o":["Abandonner","Donner","Se lever","Rendre visite"],"e":"give up = abandonner, renoncer."},{"m":"en","c":"Lexique et faux amis","d":1,"q":"« Actually » signifie :","o":["En fait","Actuellement","Finalement","Activement"],"e":"Faux ami ! « actuellement » se dit currently ou at the moment."},{"m":"en","c":"Lexique et faux amis","d":1,"q":"« To attend a meeting » signifie :","o":["Assister à une réunion","Attendre une réunion","Attaquer une réunion","Organiser une réunion"],"e":"Faux ami ! « attendre » se dit to wait for."},{"m":"hi","c":"Athènes et Rome","d":1,"q":"Qui était citoyen dans l'Athènes démocratique du Ve siècle av. J.-C. ?","o":["Les hommes adultes nés de parents athéniens","Tous les habitants","Tous les hommes, y compris esclaves","Les hommes et les femmes libres"],"e":"Femmes, esclaves et étrangers (métèques) étaient exclus de la citoyenneté."},{"m":"hi","c":"Athènes et Rome","d":1,"q":"Octave devient Auguste, premier empereur romain, en :","o":["27 av. J.-C.","476 apr. J.-C.","44 av. J.-C.","313 apr. J.-C."],"e":"Le Sénat lui confère le titre d'Auguste en 27 av. J.-C. ; 44 av. J.-C. = assassinat de César ; 476 = fin de l'Empire d'Occident."},{"m":"hi","c":"Méditerranée médiévale","d":1,"q":"Charlemagne est couronné empereur à Rome en :","o":["800","476","962","1066"],"e":"Le pape Léon III le couronne la nuit de Noël de l'an 800."},{"m":"hi","c":"Méditerranée médiévale","d":1,"q":"La première croisade s'achève par la prise de Jérusalem en :","o":["1099","800","1204","1453"],"e":"En 1099, les croisés prennent Jérusalem et fondent des États latins d'Orient."},{"m":"hi","c":"Méditerranée médiévale","d":1,"q":"En 1453, Constantinople, capitale de l'Empire byzantin, est prise par :","o":["Les Ottomans","Les Arabes","Les Mongols","Les Francs"],"e":"Mehmed II prend la ville : c'est la fin de l'Empire byzantin."},{"m":"hi","c":"Renaissance et nouveaux horizons","d":1,"q":"Christophe Colomb atteint les Amériques en :","o":["1492","1453","1517","1598"],"e":"Il pense avoir atteint les Indes en naviguant vers l'ouest pour le compte des souverains espagnols."},{"m":"hi","c":"Renaissance et nouveaux horizons","d":1,"q":"Vers 1450, Gutenberg met au point :","o":["L'imprimerie à caractères mobiles","La boussole","L'astrolabe","La poudre à canon"],"e":"L'imprimerie accélère la diffusion des idées de l'humanisme et de la Réforme."},{"m":"hi","c":"Renaissance ],"e":"Flaubert, chef de file du réalisme, fut poursuivi en justice pour ce roman."},{"m":"fr","c":"Roman et récit","d":2,"q":"Une analepse est :","o":["Un retour en arrière dans le récit","Une anticipation d'événements futurs","Un résumé","Une description"],"e":"Son contraire est la prolepse, qui annonce ou anticipe des événements à venir."},{"m":"fr","c":"Roman et récit","d":2,"q":"Un narrateur homodiégétique est :","o":["Un narrateur qui est aussi un personnage de l'histoire","Un narrateur absent de l'histoire","Un narrateur omniscient","Un narrateur qui s'adresse au lecteur"],"e":"Le récit est alors à la première personne, comme dans Les Confessions de Rousseau. Si le narrateur est absent de l'histoire, il est hétérodiégétique."},{"m":"fr","c":"Roman et récit","d":2,"q":"Une ellipse narrative est :","o":["Un passage de temps passé sous silence","Un dialogue très long","Une description détaillée","Un monologue intérieur"],"e":"Exemple : « Trois ans plus tard… » — le temps de l'histoire est supérieur au temps du récit."},{"m":"fr","c":"Roman et récit","d":3,"q":"Dans une scène (dialogue), le temps du récit est :","o":["À peu près égal au temps de l'histoire","Beaucoup plus court que l'histoire","Beaucoup plus long que l'histoire","Nul"],"e":"La scène ralentit le récit : le temps de lecture correspond presque au temps de l'action."},{"m":"fr","c":"Roman et récit","d":3,"q":"Un roman épistolaire est composé :","o":["De lettres","De pièces de théâtre","De poèmes","D'articles de journaux"],"e":"Exemples : Les Lettres persanes, Les Liaisons dangereuses."},{"m":"fr","c":"Roman et récit","d":3,"q":"Dans le discours indirect libre :","o":["Les paroles ou pensées sont rapportées sans verbe introducteur ni guillemets","Les paroles sont entre guillemets","Le narrateur résume l'action","On utilise un verbe de parole"],"e":"Il mêle la voix du narrateur et celle du personnage (Flaubert l'utilise beaucoup)."},{"m":"fr","c":"Roman et récit","d":3,"q":"Quel est le principal recuei tre signifie que les paroles s'adressent :","o":["À un personnage et en même temps au public","Uniquement au public","Uniquement au metteur en scène","À l'auteur"],"e":"Le spectateur reçoit des informations que les personnages ne connaissent pas forcément."},{"m":"fr","c":"Théâtre","d":2,"q":"La scène d'exposition sert à :","o":["Informer sur le lieu, le temps, les personnages et la situation","Dénouer l'intrigue","Annoncer la mort d'un personnage","Résumer la pièce à la fin"],"e":"Elle ouvre la pièce et doit être claire pour le spectateur."},{"m":"fr","c":"Théâtre","d":3,"q":"Qui est l'auteur du Cid (1637) ?","o":["Corneille","Racine","Molière","Marivaux"],"e":"Le Cid est une tragi-comédie de Corneille."},{"m":"fr","c":"Théâtre","d":3,"q":"Dans la tragédie, la catharsis désigne :","o":["La purgation des passions du spectateur","Le dénouement heureux","La mort du héros","Le choix du lieu"],"e":"Notion d'Aristote : pitié et crainte éprouvées par le spectateur le libèrent de ses passions."},{"m":"fr","c":"Théâtre","d":3,"q":"La stichomythie est :","o":["Un échange de répliques très courtes, souvent d'un vers chacune","Un long monologue","Un récit de bataille","Une scène de reconnaissance"],"e":"Elle donne un rythme vif au dialogue et marque l'affrontement."},{"m":"fr","c":"Théâtre","d":3,"q":"Le principe de bienséance au XVIIe siècle impose :","o":["De ne pas choquer le public (pas de violence ou de grossièreté sur scène)","De respecter l'unité de lieu","D'écrire en prose","De finir par un mariage"],"e":"C'est pourquoi les morts violentes sont racontées plutôt que montrées."},{"m":"fr","c":"Théâtre","d":3,"q":"Un quiproquo est :","o":["Un malentendu entre personnages","Un monologue","Une rime","Un décor"],"e":"Procédé comique fréquent chez Molière et Marivaux."},{"m":"fr","c":"Littérature d'idées","d":2,"q":"Qui a écrit Du contrat social (1762) ?","o":["Rousseau","Voltaire","Diderot","Montesquieu"],"e":"Rousseau y défend la souveraineté du peuple."},{"m":"fr","c":"Lit <script>
"use strict";
/* ---------- Stockage (tolérant aux erreurs) ---------- */
const KEY = "soutien-seconde-v2", OLD_KEY = "soutien-seconde-v1";
let storageOK = true;
function load() {
  try {
    const r = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    if (r) return JSON.parse(r);
  } catch (e) { storageOK = false; }
  return null;
}
let DB = Object.assign({ stats: {}, history: [], days: [], exams: [], settings: {} }, load() || {});
DB.settings = Object.assign({ n: 10, lvl: 0 }, DB.settings);
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { storageOK = false; } }

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
QUESTIONS.forEach(x => x.id = x.m + ":" + hash(x.q));
const subj = id => SUBJECTS.find(s => s.id === id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
function streak() {
  const set = new Set(DB.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const st = id => DB.stats[id] || { s: 0, c: 0, l: null };
function mastery(list) {
  if (!list.length) return 0;
  return Math.round(100 * list.filter(x => st(x.id).l === true).length / list.length);
}
/* m : "all" ou id de matière ; mods : tableau de modules (vide = tous) ; lvl : 0 = tous, sinon niveau exact ; minLvl : niveau minimum */
function pool(m, mods, lvl, minLvl) {
  return QUESTIONS.filter(x => (m === "all" || x.m === m)
    && (!mods || !mods.length || mods.includes(x.c))
    && (!lvl || x.d === lvl) && (!minLvl || x.d >= minLvl));
}
const errorsPool = () => QUESTIONS.filter(x => st(x.id).l === false);

/* Tirage pondéré : erreurs > jamais vues > déjà réussies */
function pick(list, n) {
  const items = list.map(x => { const s = st(x.id); return { x, w: s.l === false ? 5 : s.s === 0 ? 3 : 1 }; });
  const out = [];
  while (out.length < n && items.length) {
    const tot = items.reduce((a, b) => a + b.w, 0); let r = Math.random() * tot, i = 0;
    for (; i < items.length; i++) { r -= items[i].w; if (r <= 0) break; }
    out.push(items.splice(Math.min(i, items.length - 1), 1)[0].x);
  }
  return out;
}
const LV = { 0: "Tous niveaux", 1: "Essentiel", 2: "Confirmé", 3: "Expert" };

/* ---------- Navigation ---------- */
let view = { name: "home" }, quiz = null, sel = [], formOpen = false;
function go(v) { view = v; render(); window.scrollTo(0, 0); }

function tabs() {
  const t = $("#tabs");
  if (view.name === "quiz") { t.style.display = "none"; return; }
  t.style.display = "flex";
  const on = n => (view.name === n || (n === "home" && ["subject", "result"].includes(view.name))) ? "on" : "";
  t.innerHTML = `<button class="${on("home")}" data-go="home"><span>🏠</span>Accueil</button>
                 <button class="${on("stats")}" data-go="stats"><span>📈</span>Progrès</button>`;
}

/* ---------- Évaluations ---------- */
function daysLeft(date) {
  const a = new Date(date + "T00:00:00"), b = new Date(today() + "T00:00:00");
  return Math.round((a - b) / 86400000);
}
function examsSorted() {
  return DB.exams.filter(e => daysLeft(e.date) >= -7).sort((a, b) => a.date.localeCompare(b.date));
}
function dLabel(n) { return n < 0 ? "passée" : n === 0 ? "aujourd'hui" : n === 1 ? "demain" : "dans " + n + " jours"; }

/* ---------- Vues ---------- */
function vHome() {
  const total = QUESTIONS.length, seen = QUESTIONS.filter(x => st(x.id).s > 0).length;
  const errs = errorsPool().length;
  let h = `<h1>Soutien Seconde</h1><p class="sub">Objectif : 15/20 dans toutes les matières. ${total} questions, 3 niveaux.</p>`;
  if (!storageOK) h += `<div class="warn">Sauvegarde indisponible dans ce navigateur : les progrès ne seront pas conservés.</div>`;
  h += `<div class="stats">
    <div class="stat"><b>${streak()} 🔥</b><span>jours de suite</span></div>
    <div class="stat"><b>${mastery(QUESTIONS)}%</b><span>maîtrisé</span></div>
    <div class="stat"><b>${seen}/${total}</b><span>questions vues</span></div></div>`;
  h += `<div class="list"><button class="btn gold" data-start="defi">🎯 Défi 15/20 (Confirmé + Expert)</button>
        <button class="btn" data-start="all">🎲 Quiz mixte (toutes matières)</button>
        <button class="btn alt" data-start="errors" ${errs ? "" : "disabled"}>🔁 Revoir mes erreurs (${errs})</button></div>`;
  const ex = examsSorted();
  if (ex.length) {
    h += `<h2>📅 Mes évaluations</h2><div class="list">`;
    for (const e of ex) {
      const s = subj(e.subj), p = pool(e.subj, e.mods), m = mastery(p), n = daysLeft(e.date);
      const pill = n < 0 ? "" : n <= 3 ? "soon" : n <= 7 ? "mid" : "";
      h += `<div class="exam" style="--c:${s.couleur}"><div class="row"><div class="grow"><b>${s.emoji} ${esc(e.name)}</b>
        <div class="small-t">${esc(e.mods.length ? e.mods.join(" · ") : "Toute la matière")}</div></div>
        <span class="pill ${pill}">${dLabel(n)}</span><button class="x" data-delexam="${e.id}" aria-label="Supprimer">✕</button></div>
        <div class="bar" style="--c:${s.couleur}"><i style="width:${m}%"></i></div>
        <div class="row" style="margin-top:8px"><div class="small-t grow">Prêt à ${m}%</div>
        <button class="btn small" data-exam="${e.id}">Réviser</button></div></div>`;
    }
    h += `</div>`;
  }
  h += `<h2>Matières</h2><div class="grid">`;
  for (const s of SUBJECTS) {
    const p = pool(s.id), m = mastery(p);
    h += `<button class="subj" style="--c:${s.couleur}" data-subj="${s.id}">
      <div class="em">${s.emoji}</div><div class="nm">${esc(s.nom)}</div>
      <div class="bar"><i style="width:${m}%"></i></div><div class="small-t">${m}% · ${p.length} questions</div></button>`;
  }
  return h + `</div>`;
}

function vSubject() {
  const s = subj(view.id), all = pool(s.id), mods = MODULES[s.id];
  const poolSel = pool(s.id, sel, DB.settings.lvl);
  let h = `<button class="back" data-go="home">‹ Accueil</button>
    <h1>${s.emoji} ${esc(s.nom)}</h1><p class="sub">${all.length} questions · ${mastery(all)}% maîtrisé</p>
    <div class="small-t">Niveau</div>
    <div class="chips">${[0, 1, 2, 3].map(n => `<button class="chip ${DB.settings.lvl === n ? "on" : ""}" data-lvl="${n}">${LV[n]}</button>`).join("")}</div>
    <div class="small-t">Questions par quiz</div>
    <div class="chips">${[5, 10, 20, 30].map(n => `<button class="chip ${DB.settings.n === n ? "on" : ""}" data-n="${n}">${n}</button>`).join("")}</div>
    <div class="row" style="margin-top:6px"><h2 class="grow" style="margin:8px 0">Modules du programme</h2>
      <button class="btn small alt" data-selall>${sel.length === mods.length ? "Aucun" : "Tout"}</button></div>
    <p class="sub" style="margin-top:0">Coche les modules de ton prochain contrôle.</p>
    <div class="list">`;
  for (const c of mods) {
    const pc = pool(s.id, [c]), on = sel.includes(c);
    h += `<label class="item ${on ? "on" : ""}"><input type="checkbox" data-mod="${esc(c)}" ${on ? "checked" : ""}>
      <div class="grow"><b>${esc(c)}</b><div class="bar" style="--c:${s.couleur}"><i style="width:${mastery(pc)}%"></i></div>
      <div class="small-t">${pc.length} questions · ${mastery(pc)}% maîtrisé</div></div></label>`;
  }
  h += `</div><div class="list" style="margin-top:16px">
    <button class="btn" style="background:${s.couleur}" data-start="${s.id}" ${poolSel.length ? "" : "disabled"}>▶ Lancer le quiz${sel.length ? " (" + sel.length + " module" + (sel.length > 1 ? "s" : "") + ")" : " (toute la matière)"}</button>
    ${poolSel.length ? "" : `<div class="small-t center">Aucune question à ce niveau pour cette sélection.</div>`}
    <button class="btn alt" data-toggleform>📅 Programmer une évaluation</button></div>`;
  if (formOpen) {
    h += `<div class="card" style="margin-top:12px"><b>Nouvelle évaluation</b>
      <label class="f">Nom</label><input type="text" id="exname" value="Contrôle de ${esc(s.nom.replace(/ \(.*\)/, ""))}" maxlength="50">
      <label class="f">Date</label><input type="date" id="exdate" min="${today()}">
      <div class="small-t">${sel.length ? sel.length + " module(s) sélectionné(s)" : "Aucun module coché : toute la matière sera incluse."}</div>
      <button class="btn" style="margin-top:10px" data-saveexam>Enregistrer</button></div>`;
  }
  return h;
}

function vQuiz() {
  const qs = quiz.qs[quiz.i], s = subj(qs.m), n = quiz.qs.length;
  let h = `<div class="row"><button class="back" data-go="home">✕ Quitter</button><div class="grow"></div>
    <span class="small-t">${quiz.i + 1} / ${n}</span></div>
    <div class="prog"><i style="width:${(quiz.i + (quiz.done ? 1 : 0)) / n * 100}%"></i></div>
    <div><span class="tag" style="color:${s.couleur}">${s.emoji} ${esc(s.nom)}</span><span class="tag">${esc(qs.c)}</span><span class="tag lv${qs.d}">${LV[qs.d]}</span></div>
    <div class="qtext">${esc(qs.q)}</div>`;
  quiz.opts.forEach((o, k) => {
    let cls = "";
    if (quiz.done) cls = o === qs.o[0] ? "ok" : (k === quiz.chosen ? "ko" : "");
    h += `<button class="opt ${cls}" data-opt="${k}" ${quiz.done ? "disabled" : ""}>${esc(o)}</button>`;
  });
  if (quiz.done) {
    const good = quiz.opts[quiz.chosen] === qs.o[0];
    h += `<div class="expl"><b class="${good ? "good" : ""}">${good ? "Bravo ! ✅" : "Pas tout à fait ❌"}</b><br>${esc(qs.e)}</div>
      <button class="btn" data-next>${quiz.i + 1 < n ? "Question suivante" : "Voir le résultat"}</button>`;
  }
  return h;
}

function vResult() {
  const r = view.res, pct = Math.round(100 * r.ok / r.n), note = (20 * r.ok / r.n).toFixed(1).replace(".", ",");
  const msg = pct >= 90 ? "Excellent ! 🏆" : pct >= 75 ? "Très bien, au niveau de l'objectif ! 💪" : pct >= 50 ? "Bon début, on insiste ! 👍" : "Courage, c'est en forgeant… 🔨";
  let h = `<div class="big">${r.ok}/${r.n}</div><p class="center sub">≈ ${note}/20 · ${msg}</p>
    <div class="list"><button class="btn" data-again>Rejouer</button><button class="btn alt" data-go="home">Accueil</button></div>`;
  if (r.miss.length) {
    h += `<h2>À revoir</h2>`;
    for (const x of r.miss) h += `<div class="miss"><span class="tag">${esc(x.c)}</span><b>${esc(x.q)}</b><span class="good">✔ ${esc(x.o[0])}</span><br><span class="small-t">${esc(x.e)}</span></div>`;
  }
  return h;
}

function weakModules() {
  const out = [];
  for (const s of SUBJECTS) for (const c of MODULES[s.id]) {
    const p = pool(s.id, [c]), seen = p.filter(x => st(x.id).s > 0).length;
    if (seen >= 3) out.push({ s, c, m: mastery(p) });
  }
  return out.sort((a, b) => a.m - b.m).slice(0, 5);
}

function vStats() {
  let h = `<h1>Progrès</h1><p class="sub">Maîtrise = part des questions dont la dernière réponse était juste.</p>`;
  h += `<div class="lvl-row">`;
  for (const n of [1, 2, 3]) h += `<div class="stat"><b>${mastery(pool("all", null, n))}%</b><span>${LV[n]}</span></div>`;
  h += `</div>`;
  const weak = weakModules();
  if (weak.length) {
    h += `<h2>À renforcer en priorité</h2><div class="card">`;
    for (const w of weak) h += `<div class="weak"><div class="grow"><b>${w.s.emoji} ${esc(w.c)}</b><div class="small-t">${esc(w.s.nom)} · ${w.m}%</div></div>
      <button class="btn small" data-weakstart="${w.s.id}" data-chap="${esc(w.c)}">Réviser</button></div>`;
    h += `</div>`;
  }
  h += `<h2>Par matière</h2><div class="list">`;
  for (const s of SUBJECTS) {
    const p = pool(s.id), seen = p.filter(x => st(x.id).s > 0).length;
    const tot = p.reduce((a, x) => a + st(x.id).s, 0), cor = p.reduce((a, x) => a + st(x.id).c, 0);
    h += `<div class="card"><div class="row"><b class="grow">${s.emoji} ${esc(s.nom)}</b><b>${mastery(p)}%</b></div>
      <div class="bar" style="--c:${s.couleur}"><i style="width:${mastery(p)}%"></i></div>
      <div class="small-t">${seen}/${p.length} vues · réussite ${tot ? Math.round(100 * cor / tot) : 0}% sur ${tot} réponses</div></div>`;
  }
  h += `</div><h2>Derniers quiz</h2><div class="card">`;
  const hs = DB.history.slice(-10).reverse();
  h += hs.length ? hs.map(x => `<div class="hist"><span>${new Date(x.t).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} · ${esc(x.label)}</span><b>${x.ok}/${x.n}</b></div>`).join("") : `<span class="small-t">Aucun quiz pour l'instant.</span>`;
  h += `</div><h2>Données</h2>`;
  h += view.confirmReset
    ? `<div class="card"><p>Effacer tous les progrès et les évaluations ?</p><div class="row"><button class="btn small" style="background:var(--ko)" data-reset-yes>Oui, effacer</button><button class="btn small alt" data-reset-no>Annuler</button></div></div>`
    : `<button class="btn alt" data-reset>Réinitialiser mes progrès</button>`;
  return h;
}

function render() {
  const f = { home: vHome, subject: vSubject, quiz: vQuiz, result: vResult, stats: vStats }[view.name];
  $("#app").innerHTML = f();
  tabs();
}

/* ---------- Logique quiz ---------- */
/* cfg : { mode: 'subj'|'all'|'errors'|'defi'|'exam', subj, mods, lvl } */
function startQuiz(cfg) {
  let list, label;
  if (cfg.mode === "errors") { list = errorsPool(); label = "Erreurs"; }
  else if (cfg.mode === "defi") { list = pool("all", null, 0, 2); label = "Défi 15/20"; }
  else if (cfg.mode === "all") { list = pool("all", null, DB.settings.lvl); label = "Mixte"; }
  else {
    list = pool(cfg.subj, cfg.mods, cfg.lvl);
    const s = subj(cfg.subj);
    label = cfg.label || (s.nom + (cfg.mods && cfg.mods.length === 1 ? " · " + cfg.mods[0] : cfg.mods && cfg.mods.length ? " · " + cfg.mods.length + " modules" : ""));
  }
  if (!list.length) return;
  const n = Math.min(DB.settings.n, list.length);
  quiz = { cfg, label, qs: pick(list, n), i: 0, ok: 0, miss: [], done: false, chosen: null };
  setOpts(); go({ name: "quiz" });
}
function setOpts() { quiz.opts = shuffle(quiz.qs[quiz.i].o); quiz.done = false; quiz.chosen = null; }

function answer(k) {
  if (quiz.done) return;
  const x = quiz.qs[quiz.i], good = quiz.opts[k] === x.o[0], s = st(x.id);
  quiz.chosen = k; quiz.done = true;
  DB.stats[x.id] = { s: s.s + 1, c: s.c + (good ? 1 : 0), l: good };
  if (good) quiz.ok++; else quiz.miss.push(x);
  save(); render();
}
function next() {
  if (quiz.i + 1 < quiz.qs.length) { quiz.i++; setOpts(); render(); window.scrollTo(0, 0); return; }
  const t = today(); if (!DB.days.includes(t)) DB.days.push(t);
  DB.history.push({ t: Date.now(), label: quiz.label, ok: quiz.ok, n: quiz.qs.length });
  DB.history = DB.history.slice(-100); DB.days = DB.days.slice(-400); save();
  go({ name: "result", res: { ok: quiz.ok, n: quiz.qs.length, miss: quiz.miss, cfg: quiz.cfg } });
}

/* ---------- Événements (délégation) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go) { formOpen = false; return go({ name: d.go }); }
  if (d.subj) { sel = []; formOpen = false; return go({ name: "subject", id: d.subj }); }
  if (d.lvl !== undefined) { DB.settings.lvl = +d.lvl; save(); return render(); }
  if (d.n) { DB.settings.n = +d.n; save(); return render(); }
  if ("selall" in d) { sel = sel.length === MODULES[view.id].length ? [] : MODULES[view.id].slice(); return render(); }
  if ("toggleform" in d) { formOpen = !formOpen; return render(); }
  if ("saveexam" in d) {
    const name = ($("#exname").value || "").trim(), date = $("#exdate").value;
    if (!date) { $("#exdate").focus(); return; }
    DB.exams.push({ id: Date.now().toString(36), subj: view.id, name: name || "Évaluation", date, mods: sel.slice() });
    save(); formOpen = false; return go({ name: "home" });
  }
  if (d.delexam) { DB.exams = DB.exams.filter(x => x.id !== d.delexam); save(); return render(); }
  if (d.exam) { const ex = DB.exams.find(x => x.id === d.exam); if (ex) startQuiz({ mode: "subj", subj: ex.subj, mods: ex.mods, lvl: 0, label: ex.name }); return; }
  if (d.weakstart) return startQuiz({ mode: "subj", subj: d.weakstart, mods: [d.chap], lvl: 0 });
  if (d.start) {
    if (d.start === "all" || d.start === "errors" || d.start === "defi") return startQuiz({ mode: d.start });
    return startQuiz({ mode: "subj", subj: d.start, mods: sel.slice(), lvl: DB.settings.lvl });
  }
  if (d.opt !== undefined) return answer(+d.opt);
  if ("next" in d) return next();
  if ("again" in d) return startQuiz(view.res.cfg);
  if ("reset" in d) return go({ name: "stats", confirmReset: true });
  if ("resetNo" in d) return go({ name: "stats" });
  if ("resetYes" in d) { DB = { stats: {}, history: [], days: [], exams: [], settings: DB.settings }; save(); return go({ name: "stats" }); }
});
document.addEventListener("change", e => {
  const c = e.target.closest("input[data-mod]"); if (!c) return;
  const m = c.dataset.mod;
  sel = c.checked ? sel.concat(m) : sel.filter(x => x !== m);
  const keepName = $("#exname") ? $("#exname").value : null, keepDate = $("#exdate") ? $("#exdate").value : null;
  render();
  if (keepName !== null && $("#exname")) $("#exname").value = keepName;
  if (keepDate && $("#exdate")) $("#exdate").value = keepDate;
});

render();
</script>
</body>
